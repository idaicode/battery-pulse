name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查（不阻断构建）
        continue-on-error: true
        run: ruff check .

      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "value=$(python -c "from core import __version__; print(__version__)")" >> "$GITHUB_OUTPUT"

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm --clean battery-monitor.spec

      - name: 压缩产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $zip = "release/BatteryPulse-v${{ steps.ver.outputs.value }}-win64.zip"
          Compress-Archive -Path dist/BatteryPulse/* -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPulse-win64
          path: release/*.zip
          if-no-files-found: error

      # 打 tag 时自动创建 Release 并附上 zip
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
